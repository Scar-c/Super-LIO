schema_version: 1
frozen_utc: 2026-08-27
provenance_tiers:
  - DATASET_AUTHOR_BENCHMARK
  - METHOD_AUTHOR_PAPER
  - METHOD_AUTHOR_CURRENT_OPEN_SOURCE
  - DATASET_AUTHOR_ADAPTED_METHOD
  - OUR_REPRODUCTION
comparability_grades:
  A: exact sequence, evaluator/metric, sensor convention, method and config revision
  B: authoritative same-sequence score with incomplete or differing evaluator/config/revision
  C: related dataset or sequence; context only
  UNRESOLVED: mapping or metric semantics not proven
  NOT_FOUND: authoritative sources searched and no result located

evaluators:
  m2dgr_dispatch:
    status: FOUND
    tier: DATASET_AUTHOR_BENCHMARK
    repository: https://github.com/SJTU-ViSYS/M2DGR
    revision: 22beea571485845918bdad9e3bb9dd0c6c4f3db6
    readme_sha256: 8fcafe9e523d555d30a61623ee25d540f707e049974534caf5466be9b8011a7c
    rule: all published M2DGR sequences have trajectory GT and use evo
    lidar_command: evo_ape tum GT EST -vap
    visual_command: evo_ape tum GT EST -vaps
    gnss_command: evo_ape tum GT EST -vp
  m3dgr_dispatch:
    status: FOUND
    tier: DATASET_AUTHOR_BENCHMARK
    repository: https://github.com/sjtuyinjie/M3DGR
    revision: e0cf7d59c9a5a3df515624034698d976abc26549
    readme_sha256: 98fbc418df5ee1f1524f2a95fed11ef561eda81a23724c13ae231702f097349b
    rtk_or_mocap_gt: evo_ape tum GT EST -ap
    aruco_gt: ArUco_evaluate.py
    corridor01_gt_type: ArUco final relative transform, not a full trajectory
    corridor01_route: m3dgr_aruco
  ntu_dataset_author:
    status: FOUND_AND_WRAPPED
    tier: DATASET_AUTHOR_BENCHMARK
    repository: https://github.com/ntu-aris/viral_eval
    revision: 194dd4595b1fb5e8ae2a5a0c01255f816ab4082f
    source_files_sha256:
      evaluate_one.m: 20756b58d56dcaa66d9add0d41662034c01a329ca0fb4cda1215e5c853faec11
      traj_align.m: f0ab16497ab35e709bf7c2c96a44aa50eec0f1bd78b595f7cd5ddd9fbb6bb319
      combteeth.m: 817bb3070c5d778e84e54e31a5d61094ce5c444f13e70809291a89541cba9e87
      vecitp.m: 730ccf7a973fba6dfaec2729d97c5861e6dc1a493df9a890c623ab21b37323d5
      quatconv.m: 5a28231a53b18ded9d4361e0d00738e5dbcb1cb1d0bf7ce8fd0a049dbb1294a8
      trans_B2prism.csv: e4f50bcbbc3e670d268aab26ad80de77013819413833bb9642bea46db90232b9
    wrapper: scripts/super_livo/evaluation/eval_ntu_viral_official.py
    estimate_frame: IMU/body W_T_B
    gt_frame: Leica prism position in Leica world
    lever_arm_B_to_prism_m: [-0.293656, -0.012288, -0.273095]
    association: linear GT interpolation at estimate timestamps; bracket interval strictly < 0.1 s
    alignment: rigid SE3 Umeyama; no scale
    metric: translational ATE RMSE in metres
  ntu_fast_livo2:
    status: FOUND_NOT_CANONICAL
    tier: METHOD_AUTHOR_CURRENT_OPEN_SOURCE
    repository: https://github.com/hku-mars/FAST-LIVO2
    revision: 0d2c0346107b75b59934975adec9a6eeeb913c64
    path: Log/result/ntu_viral/evaluate_viral.py
    sha256: d1c8e1dc287a6595d1a62966f74fbe1bf708a63a15c9786301b5e449a05398f1
    estimate_frame: IMU/body W_T_B
    gt_frame: Leica prism
    lever_arm: same dataset value; quaternion rotation applied
    association: evo TUM nearest timestamp; default max difference
    alignment: evo --align, rigid SE3; no scale
    metric: evo translation APE RMSE in metres
  ntu_recovered_old:
    status: NOT_FOUND
    search_scope: repository, git history, committed evidence/results, durable project directories, /tmp
    note: historical Round11AA trajectory MD5/row counts survive but evaluator and trajectory files do not
  mcd:
    status: NO_DATASET_AUTHORED_ATE_EVALUATOR_FOUND
    search_date: 2026-08-27
    official_sources_checked:
      - https://mcdviral.github.io/
      - https://github.com/mcdviral/CEVA
      - MCD paper and supplementary text
      - dataset-author repositories and linked evaluation material
    official_gt: pose_inW.csv, body/VN100 W_T_B, approximately 0.1 s samples
    official_query_interface:
      repository: https://github.com/mcdviral/CEVA
      revision: 1e08fba0c1a7b7df85406483c6d202f96e11176a
      role: continuous-time spline query; not an ATE evaluator
    canonical_ours:
      tier: OUR_REPRODUCTION
      gt: official pose_inW.csv converted by scripts/super_livo/evaluation/prepare_mcd_gt.py
      wrapper: scripts/super_livo/evaluation/eval_tum_translation.py
      association: one-to-one nearest timestamp, max absolute difference 0.05 s
      interpolation: none; discrete GT
      alignment: rigid SE3 Umeyama; no scale
      metric: translational APE RMSE in metres
  oxford_spires:
    status: FOUND
    tier: DATASET_AUTHOR_BENCHMARK
    repository: https://github.com/ori-drs/oxford_spires_dataset
    revision: b456e1e2f263a79c19b6ed4052390eba609011d4
    path: scripts/localisation_benchmark/main.py
    sha256: 3a5fa4ad3bc140bff18a61bb862173a9bb983df00541c2d747a7a418326ea0dc
    command: evo_ape tum GT EST --align --t_max_diff 0.01
    association: evo nearest timestamp; max absolute difference 0.01 s
    alignment: rigid SE3 Umeyama; no scale
    metric: translation APE RMSE in metres
  m3dgr_aruco:
    status: FOUND_AND_WRAPPED
    tier: DATASET_AUTHOR_BENCHMARK
    repository: https://github.com/sjtuyinjie/M3DGR
    revision: e0cf7d59c9a5a3df515624034698d976abc26549
    path: ArUco_evaluate.py
    git_blob: 4a1ec056bcbb1189cdce2a91425524e2b8a1605b
    sha256: ab01db4b27a98027b804dc5f691dcbac22ab0cf8f46cb26502339c1a995b86ab
    wrapper: scripts/super_livo/evaluation/eval_m3dgr_aruco.py
    estimate_pose: T_W_B in strict eight-column TUM
    reference_transform: T_B0_Bend, mapping end-body coordinates into initial-body coordinates
    estimate_relative_transform: inverse(T_W_B0) @ T_W_Bend
    duplicate_final_pose: earliest pose in the trailing np.allclose-equivalent run
    primary_metric: first-to-last relative translation error in metres
    rotation_diagnostic: matrix Frobenius norm; dimensionless
    upstream_combined_rmse: NON_PRIMARY_MIXED_UNITS
    tracking_rate: 100 * (timestamp_at_last_nonduplicate - first_timestamp) / reference_duration; upper capped at 100
    applicability: only M3DGR sequences whose official GT type is ArUco; never substitute this for RTK/Mocap trajectory GT

