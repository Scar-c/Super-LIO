schema_version: 1
description: >
  Prob-LIO Prompt13 evaluator registry. Metric names are profile-specific;
  FINAL_RELATIVE_POSE profiles must never be routed through trajectory ATE.
profiles:
  ntu_viral_full_trajectory:
    dataset_family: NTU VIRAL
    sequences: [eee_01, nya_01, sbs_01]
    ground_truth_type: FULL_TRAJECTORY
    primary_metric: NTU_VIRAL_DATASET_TRANSLATION_ATE_RMSE_M
    unit: m
    evaluator_kind: ntu_official
    evaluator_path: eval/prob_lio/eval_ntu_viral_official.py
    upstream_provenance:
      repository: https://github.com/ntu-aris/viral_eval
      revision: 194dd4595b1fb5e8ae2a5a0c01255f816ab4082f
      tier: DATASET_AUTHOR_BENCHMARK
    gt_adapter_path: eval/prob_lio/pose_bag_to_tum.py
    gt_source: bag_topic
    gt_topic: /leica/pose/relative
    required_topics:
      - /os1_cloud_node1/points
      - /imu/imu
      - /leica/pose/relative
    frame_transform: >
      Estimate is IMU/body W_T_B; compare Leica prism after
      P_est += R_WB * [-0.293656,-0.012288,-0.273095] m.
    timestamp_policy: >
      Strictly increasing TUM; interpolate Leica GT at estimate stamps;
      retain only strict <0.1 s bracketing intervals.
    alignment_policy: SE3 Umeyama, no scale
    config_provenance:
      old_branch_config: configs/super_livo/reference_base/ntu_{sequence}.yaml
      old_branch_lineage: configs/super_livo/reference_base/ntu_{sequence}.lineage.yaml
      authority: SUPER_LIO_DATASET_CONFIG plus DATASET_AUTHOR_SENSOR calibration
      family_extension: >
        sbs_01 has the same NTU VIRAL sensor contract: the local
        dataset-author files provide the same topics, Leica prism lever arm,
        and identity lidar-to-IMU extrinsic as the accepted eee_01/nya_01
        contract; no sequence-specific estimator config is substituted.
    calibration_source: DATASET_AUTHOR_SENSOR files beside each NTU bag

  mcd_night08_full_trajectory:
    dataset_family: MCD
    sequences: [ntu_night_08]
    ground_truth_type: FULL_TRAJECTORY
    primary_metric: MCD_DATASET_TRANSLATION_ATE_RMSE_M
    unit: m
    evaluator_kind: tum_translation
    evaluator_path: eval/prob_lio/eval_tum_translation.py
    upstream_provenance:
      source: origin/super-livo evaluator port
      tier: PROJECT_WRAPPER_AROUND_RIGID_TUM_EVALUATION
    gt_adapter_path: eval/prob_lio/prepare_mcd_gt.py
    gt_source: external_csv
    gt_path: ../../bag/MCD/ntu_night_08/pose_inW.csv
    required_topics:
      - /livox/lidar
      - /vn100/imu
    frame_transform: >
      Verified local pose_inW.csv is W_T_B with Body=VN100 IMU;
      no prism or lever-arm compensation.
    timestamp_policy: >
      CSV t is seconds since epoch, strictly increasing; association
      max_diff=0.05 s and one-to-one matching.
    alignment_policy: SE3 Umeyama, no scale
    config_provenance:
      old_branch_config: configs/super_livo/reference_base/mcd_night08.yaml
      old_branch_lineage: configs/super_livo/reference_base/mcd_night08.lineage.yaml
      authority: SUPER_LIO_DATASET_CONFIG plus DATASET_AUTHOR_SENSOR calibration
      covariance_authority: Livox Mid-70 official measurement specification
      covariance_provenance: MCD_MID70_SENSOR_SPEC_PROXY
      effective_dept_err_m: 0.02
      effective_beam_err_deg: 0.1
      statistical_meaning: >
        Official Mid-70 range precision is an upper-bound 1-sigma value at
        20 m and angular precision is an upper-bound 1-sigma value; mapping
        them to the CalcLidarPointCov parameters is a sensor-spec proxy, not
        a dataset-author algorithm configuration.
    calibration_source: bag/MCD/atv_calib.yaml dataset-author/reconciled calibration

  mcd_day10_full_trajectory:
    dataset_family: MCD
    sequences: [ntu_day_10]
    ground_truth_type: FULL_TRAJECTORY
    primary_metric: MCD_DATASET_TRANSLATION_ATE_RMSE_M
    unit: m
    evaluator_kind: tum_translation
    evaluator_path: eval/prob_lio/eval_tum_translation.py
    upstream_provenance:
      source: origin/super-livo evaluator port
      tier: PROJECT_WRAPPER_AROUND_RIGID_TUM_EVALUATION
    gt_adapter_path: eval/prob_lio/prepare_mcd_gt.py
    gt_source: external_csv
    gt_path: ../../bag/MCD/ntu_day_10/pose_inW.csv
    required_topics:
      - /livox/lidar
      - /vn100/imu
    frame_transform: >
      Audited MCD day10 pose_inW.csv is W_T_B with Body=VN100 IMU; no prism
      or lever-arm compensation.
    timestamp_policy: >
      CSV t is seconds since epoch, strictly increasing; association
      max_diff=0.05 s and one-to-one matching.
    alignment_policy: SE3 Umeyama, no scale
    config_provenance:
      old_branch_config: configs/super_livo/reference_base/mcd_day10.yaml
      old_branch_lineage: configs/super_livo/reference_base/mcd_day10.lineage.yaml
      current_config: src/super_lio/config/MCD_ATH.yaml
      authority: SUPER_LIO_DATASET_CONFIG plus DATASET_AUTHOR_SENSOR calibration
      covariance_authority: Livox Mid-70 official measurement specification
      covariance_provenance: MCD_MID70_SENSOR_SPEC_PROXY
      effective_dept_err_m: 0.02
      effective_beam_err_deg: 0.1
      statistical_meaning: >
        Official Mid-70 range precision is an upper-bound 1-sigma value at
        20 m and angular precision is an upper-bound 1-sigma value; mapping
        them to the CalcLidarPointCov parameters is a sensor-spec proxy, not
        a dataset-author algorithm configuration.
    calibration_source: bag/MCD/atv_calib.yaml dataset-author/reconciled calibration

  oxford_quarter01_full_trajectory:
    dataset_family: Oxford Spires
    sequences: [Quarter_01]
    ground_truth_type: FULL_TRAJECTORY
    primary_metric: OXFORD_TUM_TRANSLATION_APE_RMSE_M
    unit: m
    evaluator_kind: tum_translation
    evaluator_path: eval/prob_lio/eval_tum_translation.py
    upstream_provenance:
      source: origin/super-livo evaluator port
      tier: PROJECT_WRAPPER_AROUND_RIGID_TUM_EVALUATION
    gt_source: external_tum
    gt_path: ../../bag/OXFORD/Quarter_01/gt-tum.txt
    required_topics:
      - /hesai/pandar
      - /alphasense_driver_ros/imu
    status: ACTIVE
    block_reason: null
    frame_transform: >
      Not publishable until current config and Oxford calibration/frame
      conversion are independently reconciled.
    timestamp_policy: strict increasing TUM with explicit frame/time audit required
    alignment_policy: SE3 Umeyama, no scale only after frame/time audit
    config_provenance:
      old_branch_config: configs/super_livo/reference_base/oxford_quarter01.yaml
      old_branch_lineage: configs/super_livo/reference_base/oxford_quarter01.lineage.yaml
      current_config: src/super_lio/config/oxford_quarter01.yaml
      current_config_source: origin/super-livo:src/super_lio/config/oxford_quarter01.yaml
      authority: SUPER_LIO_DATASET_CONFIG_DERIVED_FROM_OFFICIAL_CALIBRATION
      official_benchmark_repository: https://github.com/ori-drs/oxford_spires_dataset
      official_benchmark_revision: b456e1e2f263a79c19b6ed4052390eba609011d4
      official_fast_livo2_repository: https://github.com/ori-drs/FAST-LIVO2
      official_fast_livo2_branch: config-used-OSD
      official_fast_livo2_revision: f2c9abb72f82359bcb9190e31b8faa6b6b7b9a64
      official_config_path: config/oxford_spires.yaml
      official_config_git_blob: 50134830b16edee61282aaa0d5cfd7373feb883e
      official_config_sha256: 195a512df13734c69535c25ebd1bc3e033112c434796b8c2c4b5b4050c589db4
      official_voxel_source_path: src/voxel_map.cpp
      official_voxel_source_git_blob: 01923ccac6e10dec4f800e10d548c7a620d98942
      official_voxel_source_sha256: 9b5ee8914d6cc0cb96e2ba75ec034401370e38bed397442f49eb687dc6b9b856
      omitted_covariance_keys: [lio/dept_err, lio/beam_err]
      omitted_key_defaults: {dept_err_m: 0.05, beam_err_deg: 0.02}
      covariance_provenance: OXFORD_FASTLIVO2_BENCHMARK_DEFAULT
      note: >
        Existing Super-LIO Oxford topics, calibration, filtering, and IESKF
        settings are retained; only the two omitted covariance values are
        made explicit in the effective Super-LIO config.
    calibration_source: bag/OXFORD/Calibration dataset files; frame audit recorded in Prompt13 audit

  m3dgr_outdoor01_full_trajectory:
    dataset_family: M3DGR
    sequences: [Outdoor01]
    ground_truth_type: FULL_TRAJECTORY
    primary_metric: M3DGR_TUM_TRANSLATION_APE_RMSE_M
    unit: m
    evaluator_kind: tum_translation
    evaluator_path: eval/prob_lio/eval_tum_translation.py
    gt_source: external_tum
    gt_path: ../../bag/M3DGR/Outdoor01/Outdoor01.tum
    required_topics:
      - /livox/avia/lidar
      - /livox/avia/imu
    status: CONFIG_PROVENANCE_BLOCKED
    block_reason: >
      No exact current_committed_m3dgr_runner_config or Super-LIO Outdoor
      config is present in the audited current/old method-author trees;
      M2DGR.yaml, livox_360.yaml, and guessed configs are forbidden substitutes.
    frame_transform: full trajectory frame audit required after exact config recovery
    timestamp_policy: strict increasing TUM with explicit frame/time audit required
    alignment_policy: SE3 Umeyama, no scale only after frame/time audit
    config_provenance:
      old_branch_config: NOT_FOUND
      authority: CONFIG_PROVENANCE_BLOCKED

  m3dgr_outdoor04_full_trajectory:
    dataset_family: M3DGR
    sequences: [Outdoor04]
    ground_truth_type: FULL_TRAJECTORY
    primary_metric: M3DGR_TUM_TRANSLATION_APE_RMSE_M
    unit: m
    evaluator_kind: tum_translation
    evaluator_path: eval/prob_lio/eval_tum_translation.py
    gt_source: external_tum
    gt_path: ../../bag/M3DGR/Outdoor04/Outdoor04.tum
    required_topics:
      - /livox/avia/lidar
      - /livox/avia/imu
    status: CONFIG_PROVENANCE_BLOCKED
    block_reason: >
      No exact current_committed_m3dgr_runner_config or Super-LIO Outdoor
      config is present in the audited current/old method-author trees;
      M2DGR.yaml, livox_360.yaml, and guessed configs are forbidden substitutes.
    frame_transform: full trajectory frame audit required after exact config recovery
    timestamp_policy: strict increasing TUM with explicit frame/time audit required
    alignment_policy: SE3 Umeyama, no scale only after frame/time audit
    config_provenance:
      old_branch_config: NOT_FOUND
      authority: CONFIG_PROVENANCE_BLOCKED

  m3dgr_aruco_final_relative:
    dataset_family: M3DGR
    sequences: [Corridor01]
    ground_truth_type: FINAL_RELATIVE_POSE
    primary_metric: M3DGR_ARUCO_FIRST_TO_LAST_RELATIVE_TRANSLATION_ERROR_M
    unit: m
    evaluator_kind: m3dgr_aruco
    evaluator_path: eval/prob_lio/eval_m3dgr_aruco.py
    upstream_provenance:
      repository: https://github.com/sjtuyinjie/M3DGR
      revision: e0cf7d59c9a5a3df515624034698d976abc26549
      path: ArUco_evaluate.py
      tier: DATASET_AUTHOR_BENCHMARK
    gt_source: external_reference
    gt_path: ../../bag/M3DGR/Corridor01/GTCorridor01.txt
    required_topics:
      - /livox/avia/lidar
      - /livox/avia/imu
    status: EXCLUDED_BY_OWNER
    block_reason: >
      Owner explicitly excludes M3DGR Corridor01 from Prompt12; no run is
      authorized regardless of evaluator/config availability.
    frame_transform: >
      Reference is T_B0_Bend = inverse(T_W_B0) @ T_W_Bend in the
      estimator body frame; no prism conversion.
    timestamp_policy: >
      Use first valid pose and the earliest pose in the allclose duplicate
      tail according to the official wrapper; no arbitrary crop.
    alignment_policy: no alignment; compare terminal relative transform directly
    config_provenance:
      old_branch_config: configs/super_livo/reference_base/m3dgr_corridor01.yaml
      old_branch_lineage: configs/super_livo/reference_base/m3dgr_corridor01.lineage.yaml
      authority: OWNER_DECISION plus DATASET_AUTHOR_SENSOR calibration
    calibration_source: M3DGR dataset-author calibration.md at pinned revision
    forbidden_evaluators:
      - evo_ape
      - eval_tum_translation.py

  m3dgr_corridor02_unregistered:
    dataset_family: M3DGR
    sequences: [Corridor02]
    ground_truth_type: FINAL_RELATIVE_POSE
    primary_metric: M3DGR_ARUCO_FIRST_TO_LAST_RELATIVE_TRANSLATION_ERROR_M
    unit: m
    evaluator_kind: m3dgr_aruco
    evaluator_path: eval/prob_lio/eval_m3dgr_aruco.py
    gt_source: external_reference
    gt_path: ../../bag/M3DGR/Corridor02/GTCorridor02.txt
    required_topics:
      - /livox/avia/lidar
      - /livox/avia/imu
    status: EXCLUDED_BY_OWNER
    block_reason: Owner explicitly excludes M3DGR Corridor02 from Prompt12; do not run.
